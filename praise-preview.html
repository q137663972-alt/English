<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>满分特效与夸奖语 · 预览</title>
<style>
  :root{ --fg:#333; --sub:#888; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; padding:18px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        background:linear-gradient(180deg,#f7f9ff,#eef3ff); color:#333; }
  h1{ font-size:19px; margin:0 0 4px; }
  .tip{ font-size:13px; color:#888; margin-bottom:14px; line-height:1.6; }
  .btns{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .btn{ border:0; border-radius:12px; padding:10px 14px; font-size:15px; font-weight:800; color:#fff; cursor:pointer;
        background:linear-gradient(180deg,#6aa9ff,#4a86e8); box-shadow:0 4px 10px rgba(74,134,232,.28); }
  .btn.g{ background:linear-gradient(180deg,#5fd08a,#37b26a); }
  .btn.o{ background:linear-gradient(180deg,#ffb648,#f59300); }
  .btn.r{ background:linear-gradient(180deg,#ff7b7b,#ef476f); }
  .btn.p{ background:linear-gradient(180deg,#b692ff,#8a5cf6); }
  .phone{ max-width:420px; margin:0 auto; background:#fff; border-radius:20px; padding:14px;
          box-shadow:0 10px 30px rgba(0,0,0,.10); min-height:340px; }
  .result-box{ text-align:center; padding:8px 4px; }
  .read-score{ font-size:44px; font-weight:900; color:#4a86e8; margin:6px 0; }
  .best{ margin-top:6px; font-size:14px; color:#888; }
  .row{ display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .row button{ border:0; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; background:#f0f3fa; color:#456; }
</style>
</head>
<body>
<h1>🏆 满分特效 + 夸奖语 · 预览</h1>
<div class="tip">
  点下面任一按钮，看对应表现的结算页和特效（撒花 / 光环 / 顶部横幅 / 大图标 / 三颗大星），夸奖语每次随机。<br>
  这就是三科 App 里改完的样子：<b>答完一关立刻出现</b>，同时会把夸奖语<b>念出来</b>。
</div>

<div class="btns">
  <button class="btn o" onclick="demo('perfect')">🏆 满分（全对）</button>
  <button class="btn g" onclick="demo('great')">🌟 三星</button>
  <button class="btn" onclick="demo('good')">👍 及格</button>
  <button class="btn r" onclick="demo('again')">💪 没答对</button>
  <button class="btn p" onclick="demo('record')">🎊 破纪录（挑战）</button>
</div>

<div class="phone">
  <div class="result-box" id="box">
    <div style="font-size:46px">🎮</div>
    <div style="font-size:15px;color:#888">点上面的按钮看效果</div>
  </div>
</div>

<script src="js/praise.js"></script>
<script>
  function demo(level){
    var P = window.PRAISE;
    if(!P){ document.getElementById('box').innerHTML = '<div style="font-size:15px">praise.js 没加载上</div>'; return; }
    var extra = (level === 'record') ? '<div style="margin-top:4px;font-weight:900;color:#e08b00">🎊 新纪录！</div>' : '';
    var score = (level === 'record' || level === 'great') ? 130 : (level === 'good' ? 70 : (level === 'again' ? 20 : 100));
    document.getElementById('box').innerHTML =
      P.block(level, extra) +
      '<div class="read-score">' + score + '</div>' +
      '<div style="font-size:16px;color:#888">示例玩法 · 正确率 ' + (level === 'perfect' ? 100 : level === 'great' ? 95 : level === 'good' ? 70 : 20) + '%</div>' +
      '<div class="best">🏅 历史最高：' + (level === 'record' ? score : 120) + '</div>' +
      '<div class="row"><button>🔁 再来一次</button><button>🎮 换玩法</button></div>';
    setTimeout(function(){ P.fx(level); }, 60);
  }
</script>
</body>
</html>
