<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>英语乐园 · 小学1-6年级 · 13种玩法</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>⚙️ 设置</h3>
    <div class="set-row"><label>🔊 英语发音</label><div id="ttsSwitch" class="switch on"></div></div>
    <div class="set-row"><label>语速</label><input id="rateRange" type="range" min="0.5" max="1.2" step="0.05" value="0.9"></div>
    <div class="set-row"><label>试听</label><button class="btn ghost" style="width:auto;padding:8px 16px" onclick="speak('Hello, welcome to English playground!')">🔊 播放</button></div>
    <div class="set-row"><label>进度备份</label>
      <div>
        <button class="btn ghost" style="width:auto;padding:8px 12px" onclick="exportProgress()">💾 导出</button>
        <button class="btn ghost" style="width:auto;padding:8px 12px" onclick="importProgress()">📥 恢复</button>
      </div>
    </div>
    <textarea id="backupBox" class="hidden" rows="3" style="width:100%;font-size:12px;margin-top:6px"></textarea>
    <button class="btn pink" style="margin-top:8px" onclick="closeSettings()">完成</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 教材数据：人教版 新起点 1-6 年级（每年级一个文件） -->
<!-- 内容包热更新：加载器必须先于数据文件加载 -->
<script>window.CP_BASE="https://q137663972-alt.github.io/12/content/";</script>
<script src="js/cp.js"></script>
<script src="js/data-g1.js"></script>
<script src="js/data-g2.js"></script>
<script src="js/data-g3.js"></script>
<script src="js/data-g4.js"></script>
<script src="js/data-g5.js"></script>
<script src="js/data-g6.js"></script>
<!-- 发音引擎：原生 TTS + 有道音频兜底（微信可用） -->
<script src="js/tts.js"></script>
<!-- 13 种玩法 -->
<script src="js/games.js"></script>
<!-- 主程序：状态、进度、导航、启动 -->
<script src="js/app.js"></script>
<!-- 电视/机顶盒 D-pad 遥控适配（仅在 TV 模式启用，不影响手机/桌面） -->
<script src="js/tv.js"></script>
</body>
</html>
